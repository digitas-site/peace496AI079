<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc"><title>peace496AI | 株式会社デジたす</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#1b2638;background:#eff3fa}button,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.screen{min-height:100dvh;max-width:480px;margin:auto;background:#f8faff;display:flex;flex-direction:column;box-shadow:0 8px 48px #172c5622}.top{height:68px;background:#fff;border-bottom:1px solid #e8edf5;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:4}.brand{display:flex;align-items:center;gap:11px}.mark{width:41px;height:41px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#4678ff,#19c4c1);color:#fff;font-size:23px;font-weight:800}.brand strong{display:block;font-size:18px;letter-spacing:-.55px}.brand small{display:block;color:#8390a1;font-size:10px;margin-top:2px}.online{background:#eaf9f2;color:#228968;font-size:11px;border-radius:50px;padding:7px 9px}.main{flex:1;padding:20px 16px 95px;min-height:0}.welcome{text-align:center;padding:26px 3px 16px}.welcome .spark{font-size:32px;color:#5578ee}.welcome h1{font-size:24px;letter-spacing:-1px;margin:8px 0}.welcome p{font-size:13px;color:#7b8799;line-height:1.8;margin:0}.card{background:white;border:1px solid #e7edf5;border-radius:22px;box-shadow:0 4px 20px #26385e08;padding:19px;margin:12px 0}.hint{font-size:12px;color:#8190a4}.field{width:100%;border:1px solid #dbe4f1;border-radius:15px;padding:14px;resize:vertical;min-height:94px;background:#fcfdff;outline:none;color:#26354b;font-size:15px;line-height:1.7}.field:focus{border-color:#7d9cf7;box-shadow:0 0 0 3px #e7edff}.primary{background:linear-gradient(110deg,#4375f4,#3563de);color:white;border:0;border-radius:15px;padding:14px 16px;width:100%;font-weight:700;box-shadow:0 5px 15px #3d6be634}.secondary{background:white;color:#426de3;border:1px solid #cfdaff;border-radius:15px;padding:13px 14px;width:100%;font-weight:700}.action{display:grid;gap:9px;margin-top:14px}.chat{display:flex;align-items:flex-end;gap:8px;margin:17px 0}.chat.user{justify-content:flex-end}.bubble{padding:13px 15px;border-radius:17px 17px 17px 5px;background:#fff;border:1px solid #e5eaf2;font-size:14px;line-height:1.8;max-width:87%;white-space:pre-wrap}.user .bubble{background:#4777ee;border:0;border-radius:17px 17px 5px 17px;color:white}.avatar{height:30px;width:30px;flex-shrink:0;display:grid;place-items:center;border-radius:11px;background:#e7eeff;color:#4272e9;font-size:16px}.chat.user .avatar{background:#dbe5fc;color:#6d819f}.dots{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}.dots i{width:6px;height:6px;border-radius:50%;background:#557cf0;animation:bop 1s infinite alternate}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}@keyframes bop{to{transform:translateY(-5px);opacity:.35}}.card h2{font-size:16px;margin:0 0 12px}.steps{padding-left:21px;font-size:13px;line-height:1.8;color:#47556b}.steps li{margin:8px 0}.label{font-size:11px;color:#4e74d4;font-weight:700;letter-spacing:.4px}.progress{height:9px;background:#e9effa;border-radius:9px;overflow:hidden;margin-top:18px}.fill{height:100%;background:linear-gradient(90deg,#4c78f1,#20c0ad);width:0%;transition:width .45s linear;border-radius:9px}.stage-head{font-size:17px;font-weight:750;margin:8px 0 6px}.sub{font-size:13px;color:#718096;line-height:1.65}.meta{display:flex;justify-content:space-between;font-size:12px;color:#75849a;margin:9px 0 17px}.timeline{display:grid;gap:12px;border-top:1px solid #edf0f6;padding-top:16px}.entry{display:flex;gap:11px;align-items:flex-start;color:#a0a9b9;font-size:13px}.circle{width:23px;height:23px;border-radius:50%;border:1px solid #dce3ef;display:grid;place-items:center;flex-shrink:0;font-size:11px}.entry.done{color:#28846e}.entry.done .circle{background:#e2f7ef;border-color:#bce6d9}.entry.active{color:#3d6ae5;font-weight:700}.entry.active .circle{background:#e9efff;border-color:#aac1ff}.new-event{animation:appear .5s ease-out}@keyframes appear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}.people{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.person{font-size:12px;border-radius:30px;padding:7px 10px;background:#eef4ff;color:#3e69c8}.success{color:#16886b}.tag{display:inline-block;background:#e8f8f1;color:#178567;padding:6px 9px;border-radius:30px;font-size:11px;font-weight:700;margin:0 5px 6px 0}.small{font-size:11px;color:#9da8b7;line-height:1.7;margin-top:15px}.bottom{height:58px;background:#ffffff;border-top:1px solid #edf0f5;text-align:center;color:#a0abb9;font-size:10px;padding:13px}.hidden{display:none!important}#feed{margin-bottom:12px}button:focus-visible{outline:3px solid #bdd0ff;outline-offset:2px}@media(min-width:700px){.screen{margin:24px auto;border-radius:28px;min-height:calc(100dvh - 48px);overflow:hidden}.top{position:relative}}@media(prefers-reduced-motion:reduce){.dots i{animation:none}.fill{transition:none}}
</style></head><body>
<div class="screen"><header class="top"><div class="brand"><div class="mark">✦</div><div><strong>peace496AI</strong><small>株式会社デジたす</small></div></div><button id="reset" class="online" type="button" aria-label="最初から">↻ 最初から</button></header>
<main class="main" id="main"><div id="content" aria-live="polite"></div></main><footer class="bottom">peace496AI · 解決まで、いっしょに。</footer></div>
<script>
(function(){
"use strict";
const root=document.getElementById("content"), main=document.getElementById("main");
let phase="start", timers=[], run=0,progressTimer=null;
const wait=(fn,ms)=>{let id=setTimeout(fn,ms);timers.push(id)};
const jump=()=>setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}),90);
const put=(html)=>{root.insertAdjacentHTML("beforeend",html);jump()};
const escapeText=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bubble=(s,isUser)=>`<div class="chat ${isUser?"user":""}">${isUser?"":'<div class="avatar">✦</div>'}<div class="bubble">${escapeText(s)}</div>${isUser?'<div class="avatar">●</div>':""}</div>`;
function clear(){timers.forEach(clearTimeout);timers=[];if(progressTimer)clearInterval(progressTimer);progressTimer=null;run++;root.innerHTML="";phase="start"}
function init(){clear();root.innerHTML=`<div class="welcome"><div class="spark">✦</div><h1>どんなことでお困りですか？</h1><p>AIとコミュニティの知恵で、<br>解決までサポートします。</p></div><form class="card" id="ask"><label for="question" class="label">お困りのことを入力</label><textarea class="field" id="question" maxlength="500" placeholder="例：LINEの通知が届かない…">LINEの通知設定をしているのに、通知が来ない</textarea><div class="action"><button class="primary" type="submit">送信する ↗</button></div></form>`;document.getElementById("ask").addEventListener("submit", e=>{e.preventDefault();const v=document.getElementById("question").value.trim();if(v)start(v)})}
function thinking(label){put(`<div class="chat" id="think"><div class="avatar">✦</div><div class="bubble"><span class="dots"><i></i><i></i><i></i></span>　${label}</div></div>`)}
function start(q){if(phase!=="start")return;phase="thinking";root.innerHTML=bubble(q,true);thinking("回答を考えています");wait(()=>{document.getElementById("think")?.remove();put(bubble("LINEの通知が届かないのですね。まずは、iPhoneとLINEの通知設定を一緒に確認しましょう。"));put(`<div class="card"><div class="label">STEP 1 · 設定を確認</div><h2 style="margin-top:10px">LINEの通知設定</h2><ol class="steps"><li>iPhoneの「設定」→「通知」→「LINE」を開く</li><li>「通知を許可」「サウンド」がオンか確認する</li><li>LINEの「ホーム」→「設定」→「通知」を開き、通知をオンにする</li><li>集中モードなどでLINEの通知が制限されていないか確認する</li></ol><div class="action"><button class="primary" id="unchanged">通知設定を変更したけど、変化なしです</button><button class="secondary" id="already">通知が届くようになりました</button></div></div>`);document.getElementById("unchanged").onclick=escalate;document.getElementById("already").onclick=()=>finishFeedback(true);phase="first"},3200)}
const events=[
{at:0,title:"検証者を探しています",sub:"対応可能な方とマッチングしています。",status:"マッチング中"},
{at:5,title:"ひろしさんが参加しました",sub:"検証者が1人見つかりました。",status:"参加者 1/3"},
{at:9,title:"みかさんが参加しました",sub:"検証者が2人見つかりました。",status:"参加者 2/3"},
{at:13,title:"ただとさんが参加しました",sub:"3人の検証者が集まりました。",status:"参加者 3/3"},
{at:17,title:"3人による実機検証が始まりました",sub:"LINEの通知設定を確認しています。",status:"実機検証中"},
{at:27,title:"ひろしさんから検証結果が届きました",sub:"届いた結果を確認しています。",status:"回答受信 1/3"},
{at:30,title:"みかさんから検証結果が届きました",sub:"届いた結果を確認しています。",status:"回答受信 2/3"},
{at:33,title:"ただとさんから検証結果が届きました",sub:"3人の結果を照合しています。",status:"回答受信 3/3"},
{at:37,title:"安全性を確認しています",sub:"解決手順を最終確認しています。",status:"安全性チェック中"}
];
function escalate(){if(phase!=="first")return;phase="network";root.querySelectorAll(".action").forEach(el=>el.remove());put(bubble("通知設定を変更してみたけど、変化なしです。",true));thinking("追加の方法を確認しています");wait(()=>{document.getElementById("think")?.remove();put(bubble("人による検証ネットワークで検証します。少々お待ちください。"));put(`<div class="card" id="network"><div class="label">COMMUNITY VERIFICATION</div><h2 style="margin-top:9px">人による検証中</h2><div class="stage-head" id="stage">検証者を探しています</div><div class="sub" id="sub">確認できる方とマッチングしています。</div><div class="progress" role="progressbar" aria-label="検証の進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><div class="fill" id="fill"></div></div><div class="meta"><span id="status">検証ネットワークに接続中</span><b id="pct">0%</b></div><div class="timeline" id="timeline"></div></div>`);runNetwork()},1900)}
function runNetwork(){const id=run,startAt=Date.now(),duration=44000;let next=0;
function draw(){if(id!==run||phase!=="network")return;const elapsed=Date.now()-startAt,sec=elapsed/1000;
while(next<events.length&&sec>=events[next].at){const e=events[next];document.getElementById("stage").textContent=e.title;document.getElementById("sub").textContent=e.sub;document.getElementById("status").textContent=e.status;
const timeline=document.getElementById("timeline");if(next>0){const prev=timeline.lastElementChild;if(prev){prev.classList.remove("active");prev.classList.add("done");prev.querySelector(".circle").textContent="✓"}}
const item=document.createElement("div");item.className="entry active new-event";item.innerHTML=`<span class="circle">${next+1}</span><span></span>`;item.lastElementChild.textContent=e.title;timeline.appendChild(item);next++;jump()}
const pct=Math.min(99,Math.round(elapsed/duration*100));document.getElementById("fill").style.width=pct+"%";document.getElementById("pct").textContent=pct+"%";document.getElementById("bar").setAttribute("aria-valuenow",pct);
if(elapsed>=duration){clearInterval(progressTimer);progressTimer=null;document.getElementById("fill").style.width="100%";document.getElementById("pct").textContent="100%";showResult()}}
draw();progressTimer=setInterval(draw,250)}
function showResult(){if(phase!=="network")return;phase="result";document.getElementById("status").textContent="完了";document.getElementById("stage").textContent="検証が完了しました";document.getElementById("sub").textContent="検証結果の評価と安全性の確認が完了しました。";document.getElementById("timeline").querySelectorAll(".entry").forEach(el=>{el.className="entry done";el.querySelector(".circle").textContent="✓"});wait(()=>{put(bubble("検証が完了しました。3人の方に実機検証をした結果、以下の方法で解決する可能性が高いです。"));put(`<div class="card" id="solution"><div class="label success">✓ コミュニティからの解決案</div><h2 style="margin-top:10px">こちらの方法をお試しください</h2><span class="tag">3人から検証結果が届きました</span><span class="tag">安全性の確認完了</span><p class="sub">通知が来ない相手のトークだけが「通知オフ」になっている場合があります。以下を順番に確認しましょう。</p><ol class="steps"><li>通知が届かない相手のLINEトークを開く</li><li>トーク上部のメニューから「通知オフ」になっていないか確認し、必要に応じてオンに戻す</li><li>iPhoneの「設定」→「集中モード」でLINEが制限されていないか確認する</li><li>LINEを開き直し、相手にテストメッセージを送ってもらって確認する</li></ol></div><div class="card" id="feedback"><h2>解決しましたか？</h2><p class="sub">通知が届くようになったか教えてください。</p><div class="action"><button class="primary" id="yes">✓ はい、解決しました</button><button class="secondary" id="no">まだ解決していません</button></div></div>`);document.getElementById("yes").onclick=()=>finishFeedback(true);document.getElementById("no").onclick=()=>finishFeedback(false)},700)}
function finishFeedback(ok){if(!["result","first"].includes(phase))return;phase="done";document.querySelectorAll("#feedback,.card .action").forEach(e=>e.remove());put(bubble(ok?"はい、解決しました！":"まだ解決していません。",true));wait(()=>{put(bubble(ok?"よかったです！お役に立ててうれしいです。またいつでもご相談ください。":"教えていただきありがとうございます。解決していない場合は、機種やOSなどを確認しながら追加のサポートが必要です。"));put(`<div class="card"><h2>${ok?"✓ サポート完了":"追加のサポートが必要です"}</h2><div class="action"><button class="secondary" id="retry">最初からもう一度</button></div></div>`);document.getElementById("retry").onclick=init},550)}
document.getElementById("reset").onclick=init;init();
})();
</script></body></html>
